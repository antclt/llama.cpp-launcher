[package]
name = "llama_cpp_launcher"
version = "0.1.15"
edition = "2021"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
log = "0.4"
chrono = "0.4"
sys-locale = "0.3.2"

dirs = "5.0"

gguf-rs = "0.1.8"

egui-toast = "0.17"
egui-thematic = "0.1.1"
iconflow = { version = "1.0.0", features = ["pack-fluentui"] }

[target.'cfg(windows)'.dependencies]
shortcuts-rs = "1.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 需要 x11 后端支持 winit/eframe
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }

[build-dependencies]
winres = "0.1.12"
